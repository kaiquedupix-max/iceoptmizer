name: Rebuild Ice Optimizer
# Integrity build with verified updater

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "tools/**"
      - "catalog.json"
      - "assets/**"
      - "build.ps1"
      - "VERSION"
      - "README.md"
      - "THIRD-PARTY-NOTICES.md"
      - ".github/workflows/rebuild-ice.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip build]') }}
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize legacy branding in text files
        shell: powershell
        run: |
          $extensions = @('.cs','.json','.md','.html','.js','.css','.manifest','.ps1','.bat','.txt','.ini','.config','.mjs','.yml','.yaml')
          Get-ChildItem -Recurse -File | Where-Object {
            $extensions -contains $_.Extension.ToLowerInvariant() -and $_.FullName -notmatch '\\.git\\'
          } | ForEach-Object {
            $path = $_.FullName
            $content = [IO.File]::ReadAllText($path)
            $legacy = ('Maci' + 'ota')
            $clean = [Regex]::Replace($content, $legacy, 'Ice Optimizer', [Text.RegularExpressions.RegexOptions]::IgnoreCase)
            if ($clean -ne $content) {
              [IO.File]::WriteAllText($path, $clean, (New-Object Text.UTF8Encoding($false)))
            }
          }

      - name: Regenerate action catalog and hashes
        shell: powershell
        run: node tools/catalog.mjs

      - name: Run portal tests
        shell: powershell
        run: |
          Set-Location portal
          npm test

      - name: Verify legacy branding is gone from text sources
        shell: powershell
        run: |
          $extensions = @('.cs','.json','.md','.html','.js','.css','.manifest','.ps1','.bat','.txt','.ini','.config','.mjs','.yml','.yaml')
          $legacy = ('Maci' + 'ota')
          $matches = Get-ChildItem -Recurse -File | Where-Object {
            $extensions -contains $_.Extension.ToLowerInvariant() -and $_.FullName -notmatch '\\.git\\'
          } | Select-String -Pattern $legacy -CaseSensitive:$false
          if ($matches) {
            $matches | ForEach-Object { Write-Host "$($_.Path):$($_.LineNumber): $($_.Line)" }
            throw 'Legacy branding still exists in repository text files.'
          }

      - name: Verify catalog bytes match Git-published bytes
        shell: powershell
        run: |
          $catalog = Get-Content catalog.json -Raw | ConvertFrom-Json
          $bad = @()
          foreach ($entry in $catalog.files.PSObject.Properties) {
            $path = $entry.Name
            $working = (git hash-object --no-filters -- "$path").Trim()
            $published = (git hash-object --path="$path" -- "$path").Trim()
            if ($working -ne $published) {
              $bad += "$path : working=$working published=$published"
            }
          }
          if ($bad.Count -gt 0) {
            $bad | ForEach-Object { Write-Host $_ }
            throw 'Catalog files would be transformed by Git after hashing.'
          }

      - name: Build Windows executable
        shell: powershell
        run: .\build.ps1

      - name: Authenticode sign executable when certificate is configured
        shell: powershell
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)) {
            Write-Host "No Windows signing certificate configured; continuing unsigned."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'ice-codesign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse |
            Where-Object { $_.FullName -match '\x64\signtool.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe not found.' }
          & $signtool.FullName sign /fd SHA256 /td SHA256 /tr https://timestamp.digicert.com /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD 'dist\ice-optimizer.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Authenticode signing failed.' }
          Remove-Item $pfx -Force -ErrorAction SilentlyContinue

      - name: Verify executable branding
        shell: powershell
        run: |
          $bytes = [IO.File]::ReadAllBytes('dist\ice-optimizer.exe')
          $ascii = [Text.Encoding]::ASCII.GetString($bytes)
          $unicode = [Text.Encoding]::Unicode.GetString($bytes)
          $legacy = ('maci' + 'ota')
          if ($ascii -match ('(?i)'+$legacy) -or $unicode -match ('(?i)'+$legacy)) {
            throw 'Legacy branding still exists in the executable.'
          }

      - name: Verify Windows version metadata
        shell: powershell
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $info = (Get-Item 'dist\ice-optimizer.exe').VersionInfo
          if ($info.ProductName -ne 'Ice Optimizer') { throw 'ProductName metadata missing.' }
          if ($info.FileVersion -ne "$version.0") { throw "Unexpected file version: $($info.FileVersion)" }

      - name: Publish executable and verified update manifest
        shell: powershell
        run: |
          Copy-Item 'dist\ice-optimizer.exe' 'downloads\ice-optimizer.exe' -Force
          $catalog = Get-Content catalog.json -Raw | ConvertFrom-Json
          $hash = (Get-FileHash 'downloads\ice-optimizer.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = (Get-Item 'downloads\ice-optimizer.exe').Length
          $manifest = [ordered]@{
            version = [string]$catalog.version
            repository = [string]$catalog.repository
            path = 'downloads/ice-optimizer.exe'
            sha256 = $hash
            size = $size
          } | ConvertTo-Json
          [IO.File]::WriteAllText((Join-Path $PWD 'update.json'), $manifest, (New-Object Text.UTF8Encoding($false)))

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if (-not (git diff --cached --quiet)) {
            git commit -m "Publish Ice Optimizer $($catalog.version) with verified updater [skip build]"
            git pull --rebase origin main
            git push
          }
