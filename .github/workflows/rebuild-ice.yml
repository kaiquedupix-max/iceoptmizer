name: Rebuild Ice Optimizer

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "tools/**"
      - "catalog.json"
      - "assets/**"
      - "build.ps1"
      - "README.md"
      - "THIRD-PARTY-NOTICES.md"
      - ".github/workflows/rebuild-ice.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip build]') }}
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize legacy branding in text files
        shell: powershell
        run: |
          $extensions = @('.cs','.json','.md','.html','.js','.css','.manifest','.ps1','.bat','.txt','.ini','.config','.mjs','.yml','.yaml')
          Get-ChildItem -Recurse -File | Where-Object {
            $extensions -contains $_.Extension.ToLowerInvariant() -and $_.FullName -notmatch '\\.git\\'
          } | ForEach-Object {
            $path = $_.FullName
            $content = [IO.File]::ReadAllText($path)
            $legacy = ('Maci' + 'ota')
            $clean = [Regex]::Replace($content, $legacy, 'Ice Optimizer', [Text.RegularExpressions.RegexOptions]::IgnoreCase)
            if ($clean -ne $content) {
              [IO.File]::WriteAllText($path, $clean, (New-Object Text.UTF8Encoding($false)))
            }
          }

      - name: Regenerate action catalog and hashes
        shell: powershell
        run: node tools/catalog.mjs

      - name: Verify legacy branding is gone from text sources
        shell: powershell
        run: |
          $extensions = @('.cs','.json','.md','.html','.js','.css','.manifest','.ps1','.bat','.txt','.ini','.config','.mjs','.yml','.yaml')
          $legacy = ('Maci' + 'ota')
          $matches = Get-ChildItem -Recurse -File | Where-Object {
            $extensions -contains $_.Extension.ToLowerInvariant() -and $_.FullName -notmatch '\\.git\\'
          } | Select-String -Pattern $legacy -CaseSensitive:$false
          if ($matches) {
            $matches | ForEach-Object { Write-Host "$($_.Path):$($_.LineNumber): $($_.Line)" }
            throw 'Legacy branding still exists in repository text files.'
          }

      - name: Build Windows executable
        shell: powershell
        run: .\build.ps1

      - name: Verify executable branding
        shell: powershell
        run: |
          $bytes = [IO.File]::ReadAllBytes('dist\ice-optimizer.exe')
          $ascii = [Text.Encoding]::ASCII.GetString($bytes)
          $unicode = [Text.Encoding]::Unicode.GetString($bytes)
          $legacy = ('maci' + 'ota')
          if ($ascii -match ('(?i)'+$legacy) -or $unicode -match ('(?i)'+$legacy)) {
            throw 'Legacy branding still exists in the executable.'
          }

      - name: Commit cleaned sources and downloadable executable
        shell: powershell
        run: |
          Copy-Item 'dist\ice-optimizer.exe' 'downloads\ice-optimizer.exe' -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if (-not (git diff --cached --quiet)) {
            git commit -m "Regenerate Ice Optimizer without legacy branding [skip build]"
            git push
          }
